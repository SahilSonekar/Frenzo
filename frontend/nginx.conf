server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # SPA fallback — serve index.html for any route that is not a static file.
    # This ensures Vue Router history-mode routes work on a hard refresh.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — cache aggressively (Vite adds content hashes to filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-Frame-Options         "DENY"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
